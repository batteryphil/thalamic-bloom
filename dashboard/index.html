<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamba 3 MIMO | Training Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>Mamba 3 MIMO <span>Training Dashboard</span></h1>
            <div class="status-indicator">
                <div class="pulse-dot"></div>
                <span>Live</span>
            </div>
        </header>

        <main>
            <div class="metrics-grid">
                <div class="glass-card metric-card">
                    <h3>Current Step</h3>
                    <div class="value" id="val-step">--</div>
                </div>
                <div class="glass-card metric-card">
                    <h3>Loss</h3>
                    <div class="value" id="val-loss">--</div>
                </div>
                <div class="glass-card metric-card">
                    <h3>Tokens / Sec</h3>
                    <div class="value" id="val-tps">--</div>
                </div>
                <div class="glass-card metric-card">
                    <h3>GPU Temp</h3>
                    <div class="value" id="val-gpu-temp">--</div>
                </div>
                <div class="glass-card metric-card">
                    <h3>CPU Temp</h3>
                    <div class="value" id="val-cpu-temp">--</div>
                </div>
                <div class="glass-card metric-card">
                    <h3>Learning Rate</h3>
                    <div class="value" id="val-lr">--</div>
                </div>
                <div class="glass-card metric-card">
                    <h3 style="color: #ff9a9e;">Sequence Entropy</h3>
                    <div class="value" id="val-entropy">--</div>
                </div>
                <div class="glass-card metric-card">
                    <h3 style="color: #a1c4fd;">Gate Score</h3>
                    <div class="value" id="val-gate">--</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="glass-card chart-wrapper">
                    <h2>Loss Curve</h2>
                    <div class="chart-container">
                        <canvas id="lossChart"></canvas>
                    </div>
                </div>
                <div class="glass-card chart-wrapper">
                    <h2>Throughput (TPS)</h2>
                    <div class="chart-container">
                        <canvas id="tpsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="glass-card terminal-wrapper" style="grid-column: 1 / -1; margin-top: 1.5rem;">
                <h2>Model Output (Every 1000 steps)</h2>
                <div class="terminal-container" style="background: rgba(11, 15, 25, 0.8); padding: 1.5rem; border-radius: 8px; font-family: 'Courier New', Courier, monospace; color: #4facfe; min-height: 80px; font-size: 0.95rem; line-height: 1.5; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);">
                    <span id="val-salad">Waiting for Step 1000...</span>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
